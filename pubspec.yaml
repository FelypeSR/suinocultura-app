name: gspr
description: "gerenciador"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.0
  cloud_firestore: ^6.3.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  table_calendar: ^3.0.9
  intl: ^0.20.2

  # Geração e visualização/impressão de relatórios em PDF
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Geração dos ícones do app (android) a partir do iconapresized.png.
# Rodar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "lib/assets/widgets/itens/iconapresized.png"
  min_sdk_android: 21
  # Ícone adaptativo do Android 8+: fundo verde da marca + porquinho.
  adaptive_icon_background: "#3BA135"
  adaptive_icon_foreground: "lib/assets/widgets/itens/iconapresized.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/widgets/itens/logo.png
    - lib/assets/widgets/itens/google.png
    - lib/assets/widgets/itens/recover.png